name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Guards a class the build cannot see: a hook initializer reading a const
      # declared further down its own function body is a temporal-dead-zone
      # crash that blanks the page. It has shipped three times.
      - run: npm run audit:tdz
      - run: npm run lint
      # Assertions over the pure modules in src/lib. They used to live in a
      # scratchpad and vanish with the session, so they protected the change
      # that prompted them and nothing after it.
      - run: npm run test:lib
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
